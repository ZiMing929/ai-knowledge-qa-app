# ==================== Spring Boot 核心配置 ====================
spring:
  application:
    name: yu-ai-agent1

  # ==================== PostgreSQL 数据库 ====================
  datasource:
    # 从环境变量读取数据库连接地址
    url: ${DB_URL}

    # 从环境变量读取数据库用户名
    username: ${DB_USERNAME}

    # 从环境变量读取数据库密码
    password: ${DB_PASSWORD}

    driver-class-name: org.postgresql.Driver

    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      initialization-fail-timeout: 10000

  # ==================== Spring AI ====================
  ai:
    # 阿里云百炼 / 通义千问
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus

    # MCP 工具服务
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json

    # PostgreSQL PgVector 向量数据库
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000

# ==================== 后端服务器 ====================
server:
  port: 8123
  servlet:
    context-path: /api

# ==================== Swagger / OpenAPI ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

  api-docs:
    path: /v3/api-docs

  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaiagent.controller

# ==================== Knife4j ====================
knife4j:
  enable: true
  setting:
    language: zh_cn

# ==================== 日志 ====================
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug

# ==================== 联网搜索 API ====================
# 必须与 spring 平级，保持原来的属性路径
search-api:
  api-key: ${SEARCH_API_KEY}


##前端启动代码：npm.cmd run dev